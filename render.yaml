services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: clip-studio-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Supabase PostgreSQL connection URI
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true # Separate secret for signed download URLs
      - key: ALLOWED_ORIGINS
        value: https://clip-studio-frontend.onrender.com
      - key: APP_BASE_URL
        value: https://clip-studio-frontend.onrender.com # Used in reset emails
      - key: ENABLE_HEAVY_RENDERING
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: MAX_TOTAL_STORAGE_PER_USER_MB
        value: "2048"
      - key: MAX_FILES_PER_USER
        value: "50"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: clip-media
      - key: MAX_LOGIN_ATTEMPTS_PER_MIN
        value: "5"
      - key: MAX_REGISTRATIONS_PER_10MIN
        value: "3"
      # Password-reset email delivery (finding C1): preferred transport is
      # Resend (HTTP API). Paste your API key from dashboard.resend.com/api-keys.
      # With no verified domain, Resend delivers only to your own account email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. "Clip Studio <no-reply@yourdomain.com>" once domain verified
      # Classic SMTP fallback (SendGrid/Postmark/SES). Leave empty when using Resend.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # NEVER enable in production. Debug echo prints reset tokens to logs.
      - key: RESET_TOKEN_DEBUG_ECHO
        value: "0"
      # Rate limiting behind Render's proxy: one trusted proxy hop.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Bootstrap allowlist for the protected admin console.
      - key: ADMIN_EMAILS
        sync: false

  # 2. React + Vite Frontend Static Site
  - type: web
    name: clip-studio-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Keep this explicit because Render's generated host can change when a
      # service is recreated; this is the current live backend URL.
      - key: VITE_API_BASE_URL
        value: https://clip-studio-backend-jayd.onrender.com

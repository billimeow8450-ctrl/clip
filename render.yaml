services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: clip-studio-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Supabase PostgreSQL connection URI
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://clip-studio-frontend.onrender.com,http://localhost:5173
      - key: ENABLE_HEAVY_RENDERING
        value: "0"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: MAX_LOGIN_ATTEMPTS_PER_MIN
        value: "5"
      - key: MAX_REGISTRATIONS_PER_10MIN
        value: "3"

  # 2. React + Vite Frontend Static Site
  - type: web
    name: clip-studio-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: clip-studio-backend
          property: host
